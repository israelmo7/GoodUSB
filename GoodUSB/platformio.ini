; GoodUSB — ESP32-S3 composite USB HID remote (see plan: phases 1-4 + 6)
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Native USB-OTG (TinyUSB) on GPIO19/20, NOT the USB-UART bridge.
; With CDC_ON_BOOT=0, Serial is UART0 — use the UART pins/header for logs.
build_flags =
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D CORE_DEBUG_LEVEL=3
extra_scripts = pre:scripts/add_fs_include.py
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
	ESP32Async/ESPAsyncWebServer @ ^3.6.0
	ESP32Async/AsyncTCP @ ^3.3.0
